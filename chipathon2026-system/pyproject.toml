[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipathon2026-integration"
version = "0.2.0"
description = "Chipathon 2026 GF180MCU padframe integration tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chipathon-integrate = "chipathon2026_integration.cli:main"
chipathon-download-gds = "chipathon2026_integration.downloader:main"
chipathon-fullchip = "chipathon2026_integration.fullchip_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
